name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIPELINE: otlp-replay-ci
  PIPEYARD_PROJECT: ${{ github.repository }}
  PIPEYARD_BRANCH: ${{ github.ref_name }}
  PIPEYARD_COMMIT_SHA: ${{ github.sha }}
  PIPEYARD_COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
  PIPEYARD_COMMIT_TITLE: ${{ github.event.head_commit.message }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The whole history, which the secrets stage scans.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # The latest release of this repository's pipeline, run only once it is
      # proven to come from the builder's workflow on main.
      - name: Fetch the pipeline
        run: |
          tag=$(gh release list --repo rridane/rridane-pipeyard-builder --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq "[.[].tagName | select(startswith(\"$PIPELINE/v\"))][0] // empty")
          test -n "$tag" || { echo "no release of $PIPELINE"; exit 1; }
          echo "pipeline $tag"
          gh release download "$tag" --repo rridane/rridane-pipeyard-builder --pattern "$PIPELINE" --dir bin
          gh attestation verify "bin/$PIPELINE" --repo rridane/rridane-pipeyard-builder \
            --signer-workflow rridane/rridane-pipeyard-builder/.github/workflows/builder.yml \
            --source-ref refs/heads/main
          chmod +x "bin/$PIPELINE"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Start BuildKit
        run: |
          docker run -d --name buildkit --privileged -p 127.0.0.1:1234:1234 moby/buildkit:v0.34.0 --addr tcp://0.0.0.0:1234
          timeout 60 sh -c 'until docker logs buildkit 2>&1 | grep -q "running server"; do sleep 1; done'

      - run: bin/otlp-replay-ci guard
        env:
          PIPEYARD_DENYLIST: ${{ secrets.PIPEYARD_DENYLIST }}
      - run: bin/otlp-replay-ci secrets
      - run: bin/otlp-replay-ci workflows
      - run: bin/otlp-replay-ci lint
      - run: bin/otlp-replay-ci typecheck
      - run: bin/otlp-replay-ci architecture
      - run: bin/otlp-replay-ci test
      - run: bin/otlp-replay-ci lock-check
      - run: bin/otlp-replay-ci audit
